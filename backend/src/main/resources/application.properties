spring.application.name=backend

# MySQL 8.0 Database Configuration
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:incidentiq_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:incidentiq_user}
spring.datasource.password=${MYSQL_PASSWORD:YourStrongAppPassword_2026!}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gemini AI API Configuration
gemini.api.key=${GEMINI_API_KEY:}